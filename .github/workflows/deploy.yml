name: Vivy AI — Validation, Build & Deployment Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with build artifacts'
        type: boolean
        default: false
      release_tag:
        description: 'Release Tag Version (e.g., v2.0.0)'
        type: string
        default: 'v2.0.0'
      deploy_to_production:
        description: 'Trigger Live Production Deployment'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read
  deployments: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. SECURITY & SECRET AUDIT
  # ──────────────────────────────────────────────────────────────────────────
  security_audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan for Accidental Secrets & Private Keys
        run: |
          echo "=== Commencing Repository Secret Audit ==="
          # Check tracked repository files for private keys or credential extensions
          PROHIBITED_FILES=$(git ls-files | grep -E '\.(key|pem|p12|jks|keystore)$|^\.env|secrets.*\.json' | grep -v 'WSATestCertificate' || true)

          if [ -n "$PROHIBITED_FILES" ]; then
            echo "::error::Prohibited credential files detected in git tree:"
            echo "$PROHIBITED_FILES"
            exit 1
          fi

          echo "Security audit PASSED. Zero sensitive credentials detected."

  # ──────────────────────────────────────────────────────────────────────────
  # 2. PYTHON & ARCHITECTURE VALIDATION
  # ──────────────────────────────────────────────────────────────────────────
  python_validation:
    name: Python Syntax & Architecture Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Minimal Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest anyio websockets requests zeroconf psutil

      - name: Validate Python Syntax Compilation
        run: |
          echo "=== Compiling Core Python Modules ==="
          python -m compileall hub contracts vivy_windows_node agi pipeline action evolution circadian database

      - name: Execute Architecture Validator
        run: |
          echo "=== Running Canonical Architecture Validator ==="
          python architecture_validator.py

      - name: Run Headless Subsystem & Hub Unit Tests
        run: |
          echo "=== Running Headless Automated Tests ==="
          pytest tests/test_hub_capability_negotiation.py \
                 tests/test_hub_pairing.py \
                 tests/test_hub_sync.py \
                 tests/test_hub_transport.py \
                 tests/test_database_persistence.py \
                 tests/test_conversation_planner.py \
                 -v --durations=10

  # ──────────────────────────────────────────────────────────────────────────
  # 3. ANDROID NODE BUILD & VALIDATION
  # ──────────────────────────────────────────────────────────────────────────
  android_validation:
    name: Android Edge Node Validation & APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android_node/gradlew

      - name: Build Android Debug APK
        working-directory: android_node
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivy-android-node-debug-apk
          path: android_node/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # 4. PACKAGING & DISTRIBUTION ARTIFACTS
  # ──────────────────────────────────────────────────────────────────────────
  package_artifacts:
    name: Package Deployment Artifacts
    needs: [security_audit, python_validation, android_validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build Distributable Archives
        run: |
          python scripts/package_release.py --output-dir dist

      - name: Upload Vivy Core Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivy-core-distribution
          path: dist/vivy-core-distribution.zip
          retention-days: 30

      - name: Upload Vivy Windows Node Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivy-windows-node
          path: dist/vivy-windows-node.zip
          retention-days: 30

      - name: Upload Deployment Manifest
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest
          path: dist/deployment-manifest.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # 5. GITHUB RELEASE CREATION (ON TAG OR WORKFLOW DISPATCH)
  # ──────────────────────────────────────────────────────────────────────────
  create_release:
    name: Create GitHub Release
    needs: [package_artifacts]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Packaged Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Flatten Artifact Files for Release
        run: |
          mkdir -p release_files
          find release_artifacts -type f -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Vivy AI Release ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_files/*

  # ──────────────────────────────────────────────────────────────────────────
  # 6. PRODUCTION REMOTE CLOUD DEPLOYMENT (SSH / DOCKER COMPOSE)
  # ──────────────────────────────────────────────────────────────────────────
  deploy_remote_server:
    name: Deploy to Remote Production Server (Cloud / SSH)
    needs: [security_audit, python_validation, package_artifacts]
    if: |
      github.repository == 'Arthur-2407/Vivy-AI' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_production == true)) &&
      (github.event_name != 'pull_request')
    environment:
      name: production
      url: ${{ vars.VIVY_DOMAIN != '' && format('https://{0}', vars.VIVY_DOMAIN) || '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Infrastructure Configuration Report
        id: infra_check
        run: |
          echo "================================================================"
          echo "  VIVY-AI — Remote Production Infrastructure Status"
          echo "================================================================"
          echo "Repository : ${{ github.repository }}"
          echo "Commit SHA : ${{ github.sha }}"
          echo ""

          DOMAIN_OK=false
          SSH_HOST_OK=false
          SSH_KEY_OK=false
          DEPLOY_PATH_OK=false

          # Check VIVY_DOMAIN repository variable
          if [ -n "${{ vars.VIVY_DOMAIN }}" ]; then
            echo "[OK]      VIVY_DOMAIN      = ${{ vars.VIVY_DOMAIN }}"
            DOMAIN_OK=true
          else
            echo "[MISSING] VIVY_DOMAIN      — Set this in: Settings → Environments → production → Variables"
            echo "          Example value: vivy.yourdomain.com"
          fi

          # Check DEPLOY_HOST secret
          if [ -n "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "[OK]      DEPLOY_HOST      = (configured)"
            SSH_HOST_OK=true
          else
            echo "[MISSING] DEPLOY_HOST      — Remote server IP or hostname"
            echo "          Set in: Settings → Environments → production → Secrets"
          fi

          # Check DEPLOY_SSH_KEY secret
          if [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "[OK]      DEPLOY_SSH_KEY   = (configured)"
            SSH_KEY_OK=true
          else
            echo "[MISSING] DEPLOY_SSH_KEY   — Private SSH key for server access"
            echo "          Set in: Settings → Environments → production → Secrets"
          fi

          # Check DEPLOY_USER (optional, has default)
          if [ -n "${{ secrets.DEPLOY_USER }}" ]; then
            echo "[OK]      DEPLOY_USER      = (configured)"
          else
            echo "[DEFAULT] DEPLOY_USER      = ubuntu (no secret set, using default)"
          fi

          # Check DEPLOY_PATH (optional, has default)
          if [ -n "${{ secrets.DEPLOY_PATH }}" ]; then
            echo "[OK]      DEPLOY_PATH      = (configured)"
            DEPLOY_PATH_OK=true
          else
            echo "[DEFAULT] DEPLOY_PATH      = /opt/vivy (no secret set, using default)"
          fi

          echo ""
          if [ "$SSH_HOST_OK" = "true" ] && [ "$SSH_KEY_OK" = "true" ]; then
            echo "has_ssh=true" >> $GITHUB_OUTPUT
            echo "[READY]   SSH credentials are configured. Will proceed with remote deployment."
          else
            echo "has_ssh=false" >> $GITHUB_OUTPUT
            echo "================================================================"
            echo "  BLOCKED: Remote deployment cannot proceed."
            echo "  To enable real live deployment, add the missing secrets above"
            echo "  to the 'production' environment on GitHub:"
            echo "  → https://github.com/Arthur-2407/Vivy-AI/settings/environments"
            echo "================================================================"
          fi

          if [ "$DOMAIN_OK" = "false" ]; then
            echo ""
            echo "  NOTE: VIVY_DOMAIN is not set. GitHub Deployments page will show"
            echo "  no URL until this variable is configured. This is NOT localhost."
            echo "  Add it under Settings → Environments → production → Variables."
          fi

      - name: Checkout Authoritative Source
        if: steps.infra_check.outputs.has_ssh == 'true'
        uses: actions/checkout@v4

      - name: Execute Remote SSH Rollout & Health Checks
        if: steps.infra_check.outputs.has_ssh == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            TARGET_PATH="${{ secrets.DEPLOY_PATH || '/opt/vivy' }}"
            VIVY_DOMAIN="${{ vars.VIVY_DOMAIN }}"

            echo "=== Vivy-AI Remote Rollout Starting ==="
            echo "Commit    : ${{ github.sha }}"
            echo "Domain    : ${VIVY_DOMAIN}"
            echo "Deploy Dir: ${TARGET_PATH}"

            mkdir -p "${TARGET_PATH}"
            cd "${TARGET_PATH}"

            # Pull latest code if git repo exists, otherwise clone
            if [ -d ".git" ]; then
              git fetch origin main --tags
              git checkout ${{ github.sha }}
            else
              git clone https://github.com/Arthur-2407/Vivy-AI.git .
              git checkout ${{ github.sha }}
            fi

            bash "${TARGET_PATH}/scripts/deploy_remote.sh" "${TARGET_PATH}" "${{ github.sha }}" "${VIVY_DOMAIN}"

      - name: Report Deployment Outcome
        if: always()
        run: |
          if [ "${{ steps.infra_check.outputs.has_ssh }}" != 'true' ]; then
            echo "::notice title=Infrastructure Required::Remote deployment skipped — DEPLOY_HOST and DEPLOY_SSH_KEY secrets are not yet configured in the production environment. Add them at https://github.com/Arthur-2407/Vivy-AI/settings/environments to enable real live deployment."
          else
            echo "::notice title=Deployment Complete::Remote deployment executed via SSH. Check the remote server logs for detailed health status."
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # 7. PRODUCTION DEDICATED HARDWARE RUNNER (OPTIONAL SELF-HOSTED RUNNER)
  # ──────────────────────────────────────────────────────────────────────────
  deploy_production_runner:
    name: Deploy to Dedicated Hardware Host (Self-Hosted Runner)
    needs: [security_audit, python_validation, package_artifacts]
    if: |
      github.repository == 'Arthur-2407/Vivy-AI' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy_to_production == true)) &&
      (github.event_name != 'pull_request')
    environment:
      name: production
      url: ${{ vars.VIVY_DOMAIN != '' && format('https://{0}', vars.VIVY_DOMAIN) || '' }}
    runs-on: [self-hosted, Windows, X64, vivy-production]
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
    continue-on-error: true
    steps:
      - name: Verify Execution Authorization & Security Boundary
        run: |
          Write-Output "=== Commencing Protected Production Deployment on Dedicated Hardware Host ==="
          Write-Output "Repository : ${{ github.repository }}"
          Write-Output "Ref        : ${{ github.ref }}"
          Write-Output "Commit SHA : ${{ github.sha }}"
          Write-Output "Domain     : ${{ vars.VIVY_DOMAIN }}"
          # Release any file locks from previous background runs
          Stop-Process -Name python, caddy -Force -ErrorAction SilentlyContinue

      - name: Checkout Authoritative Source
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Execute Production Deployment & Rolling Update
        run: |
          $py = (Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if (-not $py -or -not (Test-Path $py)) {
              if (Test-Path "d:\Vivy\venv\Scripts\python.exe") {
                  $py = "d:\Vivy\venv\Scripts\python.exe"
              } elseif (Test-Path "C:\Users\SATYAJEET\AppData\Local\Programs\Python\Python310\python.exe") {
                  $py = "C:\Users\SATYAJEET\AppData\Local\Programs\Python\Python310\python.exe"
              } else {
                  $py = "python"
              }
          }
          Write-Output "Selected Python Runtime: $py"
          & $py scripts/deploy_production.py --commit ${{ github.sha }} --env production

      - name: Execute End-to-End Production Smoke Test
        run: |
          $py = (Get-Command python.exe -ErrorAction SilentlyContinue).Source
          if (-not $py -or -not (Test-Path $py)) {
              if (Test-Path "d:\Vivy\venv\Scripts\python.exe") {
                  $py = "d:\Vivy\venv\Scripts\python.exe"
              } elseif (Test-Path "C:\Users\SATYAJEET\AppData\Local\Programs\Python\Python310\python.exe") {
                  $py = "C:\Users\SATYAJEET\AppData\Local\Programs\Python\Python310\python.exe"
              } else {
                  $py = "python"
              }
          }
          & $py scripts/smoke_test.py --host 127.0.0.1 --web-port 8080 --retries 5 --timeout 5

